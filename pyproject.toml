[project]
name = "aether"
version = "1.0.0"
description = "Aether: a local AI companion engine and app"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "sherpa-onnx==1.10.46",
    "numpy>=1.26.4,<2",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 120
